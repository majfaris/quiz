<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار لوحة القياس وخطوات القيادة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one narrow instrument-panel column; a single card per screen, amber "warning lamp" accent */
:root{
  --bg:#eef0ee; --panel:#ffffff; --ink:#1b2320; --muted:#5d6a64; --line:#d5dbd7;
  --accent:#d98a00; --accent-ink:#1b1300; --accent-soft:#fdf1d8;
  --ok:#1f8a4c; --ok-soft:#e2f4e9; --bad:#c2372b; --bad-soft:#fbe5e2;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#1a211e; --ink:#e7ece9; --muted:#97a39d; --line:#2c3632;
  --accent:#f2a516; --accent-ink:#1b1300; --accent-soft:#2f2612;
  --ok:#4cc17e; --ok-soft:#163222; --bad:#ef6a5d; --bad-soft:#3a1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#1a211e; --ink:#e7ece9; --muted:#97a39d; --line:#2c3632;
  --accent:#f2a516; --accent-ink:#1b1300; --accent-soft:#2f2612;
  --ok:#4cc17e; --ok-soft:#163222; --bad:#ef6a5d; --bad-soft:#3a1a17; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px}
.lamp{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);flex:none}
h1{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modes{display:grid;gap:10px}
.mode{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel)}
.mode:hover,.mode:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.mode b{font-weight:600;display:block}
.mode span{color:var(--muted);font-size:.88rem}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.tag{font-size:.78rem;letter-spacing:.02em;color:var(--accent);font-weight:600}
.q{font-size:1.18rem;font-weight:600;margin:0;line-height:1.6}
.fig{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.fig img{display:block;width:100%;height:auto}
:root[data-theme="dark"] .fig img{filter:invert(.9) hue-rotate(180deg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fig img{filter:invert(.9) hue-rotate(180deg)}}
.fig{background:var(--panel)}
.opts{display:grid;gap:8px}
.opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not([disabled]),.opt:focus-visible{border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:10px 14px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:11px 20px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.mode:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{font-family:var(--display);font-size:3rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rev{display:flex;flex-direction:column;gap:10px}
.rev div{border-inline-start:3px solid var(--bad);padding-inline-start:12px;font-size:.93rem}
.rev small{color:var(--muted);display:block}
.order-list{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.order-list li{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;line-height:1.5}
.order-list li .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:.85rem;font-variant-numeric:tabular-nums}
.order-list li.picked{border-color:var(--accent);background:var(--accent-soft)}
.order-list li.picked .n{background:var(--accent);color:var(--accent-ink)}
.order-list li.ok{border-color:var(--ok);background:var(--ok-soft)}
.order-list li.bad{border-color:var(--bad);background:var(--bad-soft)}
.order-list li .fix{margin-inline-start:auto;font-size:.8rem;color:var(--bad);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

<div class="wrap" dir="rtl" lang="ar">

</div>

  const b=shuffle(DASH).slice(0,8).map(([n,name])=>mcq("لوحة القياس",`ما رقم «${name}» في الرسم؟`,n,pick(nums,3,n),{img:true}));
  const c=[
   mcq("لوحة القياس","أي جهاز يُستخدم لفصل البطارية عند الطوارئ؟","مفتاح الفصل عند الطوارئ لمفتاح البطارية الرئيسي (14)",["مفتاح التسخين المقدم والإدارة (9)","الزر الانضغاطي لبدء الحركة (6)","مجموعة مفاتيح انضغاطية (8)"]),
   mcq("لوحة القياس","أي مقياس يوضح حرارة المحرك من خلال سائل التبريد؟","المقياس رقم 12",["المقياس رقم 1","المقياس رقم 13","المقياس رقم 11A"]),
   mcq("لوحة القياس","المقياس 11A خاص بأي تجهيزة؟","نقل الحركة الأوتوماتيكي (حرارة الزيت)",["المحور الخلفي","الكشافات الرئيسية","البطارية"]),
   mcq("لوحة القياس","ما الذي يتحكم به الجهاز رقم 15؟","ضبط مجموعة الكشافات الرئيسية",["سرعة دوران المحرك","التسخين المقدم","إقفال التروس التفاضلية"])
  ];
  return [...a,...b,...c];
}
function stepQs(){
  const qs=[];
  shuffle(STEPS.map((s,i)=>i)).slice(0,6).forEach(i=>qs.push(mcq("خطوات القيادة",`ما الخطوة رقم ${i+1}؟`,STEPS[i],pick(STEPS,3,STEPS[i]))));
  shuffle([...Array(13).keys()]).slice(0,4).forEach(i=>qs.push(mcq("خطوات القيادة",`أي خطوة تأتي مباشرة بعد: «${STEPS[i]}»؟`,STEPS[i+1],pick(STEPS.filter(x=>x!==STEPS[i]),3,STEPS[i+1]))));
  qs.push(
   mcq("خطوات القيادة","ما أول خطوة قبل قيادة العربة؟","تفقد الآلية من جميع الجهات",["تشغيل الآلية","ربط حزام الأمان","تعديل المرايا الجانبية"]),
   mcq("خطوات القيادة","ما الهدف من وزن المقعد عند الركوب داخل الغمارة؟","السيطرة الكاملة على الآلية",["توفير الوقود","رؤية لوحة القياس فقط","تسهيل نقل القير"]),
   mcq("خطوات القيادة","كيف يكون وضع الكتفين أثناء الجلوس؟","موازيين لظهر مقعد السائق",["مائلين للأمام","بعيدين عن ظهر المقعد","مرتفعين فوق مسند الرأس"]),
   mcq("خطوات القيادة","ماذا تشمل معالم السلامة التي نتأكد منها بعد التشغيل؟","اللمبات، الأمبيرات، أفياش التشغيل",["الجلنط، الفرامل، الكلتش","المرايا، المقعد، الحزام","الإطارات، الزيت، الماء"]),
   mcq("خطوات القيادة","ماذا يشمل فحص الضوابط؟","الجلنط اليدوي، الفرامل، الكلتش، الدبلات",["اللمبات، الأمبيرات، الأفياش","المرايا الجانبية والمقعد","الإشارات والفليشر"]),
   mcq("خطوات القيادة","عند نقل القير، ما الرقم الذي لا يجب أن يتجاوزه الكمبرشر؟","15",["10","20","25"]),
   mcq("خطوات القيادة","متى تُستخدم الإشارات؟","أثناء الانعطافات",["أثناء الوقوف فقط","عند التشغيل","عند ربط الحزام"]),
   mcq("خطوات القيادة","متى يُستخدم الجلنط؟","بعد الوقوف تماماً",["أثناء الانعطاف","قبل الوقوف بقليل","أثناء نقل القير"]),
   mcq("خطوات القيادة","متى يُستخدم الفليشر؟","أثناء الوقوف",["أثناء الانعطافات","عند التجاوز","عند التشغيل"]),
   mcq("خطوات القيادة","أي جهة من الطريق تُستخدم أثناء القيادة؟","أيمن الطريق",["أيسر الطريق","وسط الطريق","حسب حركة السير"]),
   mcq("خطوات القيادة","ما المقصود بالقيادة بسرعة مرضية للآليات الأخرى؟","عدم تجاوز السرعة المطلوبة وعدم التباطؤ المفرط",["القيادة بأعلى سرعة ممكنة","القيادة ببطء دائماً","مجاراة أسرع آلية"]),
   mcq("خطوات القيادة","ماذا يُمنع أثناء القيادة حسب الخطوة 11؟","الوقوف في وسط الطريق",["استخدام الإشارات","استخدام أيمن الطريق","تعديل المرايا"]),
   mcq("خطوات القيادة","متى يُربط حزام الأمان حسب الترتيب؟","بعد فحص الضوابط وقبل نقل القير",["قبل تفقد الآلية","بعد استخدام الإشارات","قبل الركوب في الغمارة"])
  );
  return qs;
}
const MODES=[
 {id:"dash",title:"لوحة أجهزة القياس",desc:"أسماء الأجهزة وأرقامها على الرسم",make:()=>shuffle(dashQs()).slice(0,15)},
 {id:"steps",title:"خطوات القيادة الآمنة",desc:"محتوى الخطوات الـ14 وترتيبها",make:()=>shuffle(stepQs()).slice(0,15)},
 {id:"mix",title:"اختبار شامل",desc:"أسئلة مختلطة من الملفين",make:()=>shuffle([...shuffle(dashQs()).slice(0,10),...shuffle(stepQs()).slice(0,10)])},
 {id:"order",title:"رتّب الخطوات",desc:"اضغط على الخطوات الـ14 بالترتيب الصحيح",make:null}
];
const app=document.getElementById("app");
let S={};
function home(){
  app.innerHTML=`<div class="card"><p class="q" style="font-size:1.05rem">اختر نوع الاختبار</p><div class="modes">${MODES.map(m=>`<button class="mode" data-id="${m.id}"><div><b>${m.title}</b><span>${m.desc}</span></div><span class="count">${m.id==="order"?"14 خطوة":m.id==="mix"?"20 سؤال":"15 سؤال"}</span></button>`).join("")}</div></div>`;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.id));
}
function start(id){
  if(id==="order") return order();
  S={id,qs:MODES.find(m=>m.id===id).make(),i:0,score:0,wrong:[]};render();
}
function render(){
  const q=S.qs[S.i],n=S.qs.length;
  app.innerHTML=`<div class="card">
   <div class="meta"><span>سؤال ${S.i+1} من ${n}</span><span>الدرجة: ${S.score}</span></div>
   <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
   <span class="tag">${q.tag}</span>
   <p class="q">${q.q}</p>
   ${q.img?`<div class="fig"><img src="${IMG}" alt="رسم لوحة أجهزة القياس مع الأرقام"></div>`:""}
   <div class="opts">${q.choices.map((c,k)=>`<button class="opt" data-k="${k}"><span class="k">${"أبجد"[k]}</span><span>${c}</span></button>`).join("")}</div>
   <div id="fb"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  const q=S.qs[S.i],ok=q.choices[k]===q.ans;
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.choices[j]===q.ans)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
  if(ok)S.score++;else S.wrong.push({q:q.q,your:q.choices[k],ans:q.ans});
  const last=S.i===S.qs.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"إجابة صحيحة":"إجابة خاطئة — الصحيح: "+q.ans}</div><div class="row" style="margin-top:12px"><button class="btn" id="nx">${last?"عرض النتيجة":"السؤال التالي"}</button></div>`;
  const nx=document.getElementById("nx");nx.focus();nx.onclick=()=>{if(last)result();else{S.i++;render()}};
}
function result(){
  const n=S.qs.length,p=Math.round(S.score/n*100);
  const msg=p>=90?"ممتاز، أنت جاهز":p>=70?"جيد جداً، راجع الأخطاء القليلة":p>=50?"مقبول، تحتاج مراجعة":"تحتاج مراجعة الملفين مرة أخرى";
  app.innerHTML=`<div class="card"><span class="tag">النتيجة</span><div class="score">${S.score} / ${n}</div><p class="q">${p}% · ${msg}</p>
   <div class="row"><button class="btn" id="again">إعادة الاختبار بأسئلة جديدة</button><button class="btn ghost" id="home">اختيار اختبار آخر</button></div></div>
   ${S.wrong.length?`<div class="card"><span class="tag">راجع أخطاءك</span><div class="rev">${S.wrong.map(w=>`<div>${w.q}<small>إجابتك: ${w.your}</small><small style="color:var(--ok)">الصحيح: ${w.ans}</small></div>`).join("")}</div></div>`:""}`;
  document.getElementById("again").onclick=()=>start(S.id);
  document.getElementById("home").onclick=home;
}
function order(){
  const items=shuffle(STEPS.map((s,i)=>({s,i})));let picked=[];
  app.innerHTML=`<div class="card"><span class="tag">رتّب الخطوات</span><p class="q">اضغط على الخطوات بالترتيب الصحيح من الأولى إلى الأخيرة. اضغط على خطوة مختارة لإلغائها.</p>
   <ul class="order-list" id="ol"></ul><div class="row"><button class="btn" id="chk">تحقق من الترتيب</button><button class="btn ghost" id="home">رجوع</button></div><div id="fb"></div></div>`;
  const ol=document.getElementById("ol");let done=false;
  function draw(){
    ol.innerHTML=items.map((it,j)=>{const p=picked.indexOf(j);return`<li data-j="${j}" tabindex="0" class="${p>-1?"picked":""}"><span class="n">${p>-1?p+1:""}</span><span>${it.s}</span></li>`}).join("");
    ol.querySelectorAll("li").forEach(li=>{const f=()=>{if(done)return;const j=+li.dataset.j,p=picked.indexOf(j);if(p>-1)picked.splice(p);else picked.push(j);draw()};li.onclick=f;li.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  }
  draw();
  document.getElementById("home").onclick=home;
  document.getElementById("chk").onclick=()=>{
    if(done){order();return}
    if(picked.length<14){document.getElementById("fb").innerHTML=`<div class="fb bad" style="margin-top:8px">اختر الخطوات الـ14 كلها أولاً (اخترت ${picked.length}).</div>`;return}
    done=true;let c=0;
    const sorted=picked.map((j,p)=>({...items[j],p}));
    ol.innerHTML=sorted.map(it=>{const ok=it.i===it.p;if(ok)c++;return`<li class="${ok?"ok":"bad"}"><span class="n">${it.p+1}</span><span>${it.s}</span>${ok?"":`<span class="fix">مكانها ${it.i+1}</span>`}</li>`}).join("");
    document.getElementById("fb").innerHTML=`<div class="fb ${c===14?"ok":"bad"}" style="margin-top:8px">${c} من 14 في مكانها الصحيح${c===14?" — ترتيب كامل":""}</div>`;
    document.getElementById("chk").textContent="حاول مرة أخرى";
  };
}
home();
</script>

</body>
</html>
